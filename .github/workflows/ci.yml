name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Tool docs are up to date
        run: |
          python scripts/gen_tools_doc.py
          git diff --exit-code docs/TOOLS.md

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: daily-tutor-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (auth must be enforced)
        run: |
          docker run -d --name tutor -p 8000:8000 -e TUTOR_API_TOKENS=ci:ci daily-tutor-mcp:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" localhost:8000/mcp || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          echo "HTTP status without token: $code"
          [ "$code" = "401" ]
      - name: Container logs
        if: failure()
        run: docker logs tutor
