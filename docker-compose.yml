services:
  tutor:
    build: .
    image: ghcr.io/fritnes/daily-tutor-mcp:latest
    container_name: daily-tutor-mcp
    restart: unless-stopped
    env_file: .env            # copy .env.example to .env and set TUTOR_API_TOKENS
    ports:
      - "127.0.0.1:${TUTOR_PORT:-8000}:8000"   # bound to localhost: put TLS/reverse proxy in front
    volumes:
      - tutor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # 401 means "up, auth required", which is what we want from an unauthenticated probe
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, urllib.error as e, sys\ntry:\n u.urlopen('http://127.0.0.1:8000/mcp', timeout=3)\nexcept e.HTTPError as x:\n sys.exit(0 if x.code in (401, 405, 406) else 1)\nexcept Exception:\n sys.exit(1)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tutor-data:
